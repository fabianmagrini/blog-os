- id: idea-001
  working_title: "The Agent Harness Is Becoming More Important Than the Model"
  question: >
    As frontier model capability converges across vendors, what determines
    whether an AI coding agent is actually reliable in production use?
  hypothesis: >
    Harness design — context management, tool scoping, permission gating,
    and workflow structure — is becoming a bigger driver of agent
    reliability than which underlying model is used.
  why_now: >
    Multiple frontier models have reached roughly comparable raw capability
    on coding benchmarks, while real-world reliability of agent products
    built on them still varies widely.
  target_reader: principal engineers, architects, engineering leaders
  potential_argument: >
    If capability is converging, the remaining differentiation moves to the
    harness: context strategy, tool design, guardrails, and workflow
    structure.
  supporting_signals:
    - signal-2026-09-05-001
  counterargument: >
    Model capability gaps are still large enough on specific hard tasks
    (long-horizon planning, novel algorithm design) that harness quality
    cannot fully compensate for a weaker underlying model.
  author_experience_required: >
    Direct experience operating agent harnesses in production engineering
    workflows, and comparing outcomes across underlying models.
  originality_score: 4
  scores:
    relevance: 5
    originality: 4
    author_expertise: 5
    reader_value: 5
    evidence: 4
    timeliness: 5
  status: shortlisted

- id: idea-002
  working_title: >
    What "Surrounded by Idiots" Gets Right (and Wrong) About Communicating
    on an Engineering Team
  question: >
    Does the DISC-based four-color communication framework popularized by
    Thomas Erikson's "Surrounded by Idiots" hold up as a practical tool for
    day-to-day communication on software engineering teams?
  hypothesis: >
    The book's framework rests on weak psychometric science, but its
    practical heuristics map cleanly onto recurring friction points in
    engineering work (code review tone, incident communication, standups,
    cross-team negotiation) — and are worth adapting deliberately, with the
    scientific caveat stated up front rather than glossed over.
  why_now: >
    Communication friction is a recurring root cause in engineering
    retros and 360 reviews, and pop-psychology personality frameworks keep
    resurfacing in team offsites and 1:1s. Technical readers are typically
    given either uncritical enthusiasm or blanket dismissal of these tools —
    rarely a rigorous middle path.
  target_reader: engineering managers, staff/principal engineers, team leads
  potential_argument: >
    Translate the book's four communication archetypes into specific
    engineering scenarios (giving code review feedback, running an incident
    retro, disagreeing in a design review) with concrete adaptation
    strategies, while being explicit that this is a practical heuristic, not
    a validated psychological instrument.
  supporting_signals: []
  counterargument: >
    DISC-style four-quadrant personality models have weak empirical support
    in psychology (poor test-retest reliability, weak predictive validity),
    oversimplify individuals into fixed types, and are easily misused to
    stereotype or dismiss a colleague ("that's just a red") instead of
    actually listening to them.
  author_experience_required: >
    A real instance of applying (or watching a teammate apply) a
    communication-style adaptation on an actual engineering team, and what
    changed as a result.
  originality_score: 3
  scores:
    relevance: 4
    originality: 3
    author_expertise: 4
    reader_value: 4
    evidence: 3
    timeliness: 3
  status: shortlisted

- id: idea-003
  working_title: "Goose, Zig, or Rust: Choosing a Systems Language When One of the Options Is Weeks Old"
  question: >
    How should an engineering team choose between Rust, Zig, and the new
    Goose language for a new project, when one option is mature, one is
    established but pre-stable (to verify), and one is brand new with
    self-reported performance claims?
  hypothesis: >
    The decision turns less on peak performance or the memory-safety
    mechanism than on maturity risk, ecosystem, and which constraints the
    project can live with. Goose is not yet a production candidate but is
    worth tracking for what it shows about safety without lifetime
    annotations.
  why_now: >
    Goose appeared recently with strong benchmark claims against safe Rust,
    and was built almost entirely with AI from a human design. Teams will be
    asked "should we look at this?" before any independent evidence exists.
  target_reader: staff/principal engineers, architects, engineering leaders choosing a stack
  potential_argument: >
    Offer a decision framework (workload fit, safety guarantees, maturity
    and bus-factor risk, ecosystem and hiring, interop with C) and apply it
    to all three, stating what evidence would move Goose from "watch" to
    "pilot".
  supporting_signals:
    - signal-2026-10-25-001
  counterargument: >
    Dismissing a young language on maturity alone is how teams miss real
    shifts; removing lifetime annotations may remove Rust's largest adoption
    cost, and the benchmark and safety claims, if they hold, would matter.
  author_experience_required: >
    Hands-on experience shipping with Rust and/or Zig, and ideally a real
    stack-selection decision and its consequences. Not yet known; to be
    confirmed with the author.
  originality_score: 3
  scores:
    relevance: 4
    originality: 3
    author_expertise: 3  # unconfirmed: author's Rust/Zig experience unknown
    reader_value: 4
    evidence: 3  # Goose evidence is self-reported; Rust/Zig facts still need sourcing
    timeliness: 5
  status: shortlisted
